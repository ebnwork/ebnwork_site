<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EBN site check</title></head>
<body style="margin:0;padding:14px;font:15px/1.5 Arial,sans-serif;background:#fff;color:#000">
<h2 style="margin:0 0 6px">EBN site check</h2>
<p style="margin:0 0 10px;color:#444">Wait about 10 seconds, then take a screenshot of this page and send it.</p>
<pre id="o" style="white-space:pre-wrap;word-break:break-word;font:13px/1.5 monospace;margin:0">Running checks...</pre>
<script>
var o=document.getElementById('o'),L=[];
function say(t){L.push(t);o.textContent=L.join('\n')}
say('Browser: '+navigator.userAgent);
say('Dialog supported: '+(typeof HTMLDialogElement!=='undefined'));
try{localStorage.setItem('t','1');localStorage.removeItem('t');say('Saved storage works: yes')}catch(e){say('Saved storage works: NO ('+e.message+')')}
var errs=[];
window.addEventListener('message',function(e){if(e.data&&e.data.err){errs.push(e.data.err+' (line '+e.data.line+')');say('PAGE ERROR: '+e.data.err+' (line '+e.data.line+')')}});
fetch('index.html?'+Date.now()).then(function(r){say('index.html loads: HTTP '+r.status);return r.text()}).then(function(h){
  say('index.html size: '+h.length+' characters');
  say('Has Sign up button: '+(h.indexOf('data-a="signup"')>-1)+' | Has BizTrack: '+(h.indexOf('BizTrack')>-1));
  var m=h.match(/<script>([\s\S]*?)<\/script>/);
  try{new Function(m[1]);say('Page script reads correctly: yes')}catch(e){say('PAGE SCRIPT SYNTAX ERROR: '+e.message)}
  var catcher='<script>window.addEventListener("error",function(e){parent.postMessage({err:e.message,line:e.lineno},"*")});window.addEventListener("unhandledrejection",function(e){parent.postMessage({err:"promise: "+(e.reason&&e.reason.message||e.reason),line:0},"*")})<\/script>';
  var f=document.createElement('iframe');f.style.cssText='position:absolute;left:-9999px;width:390px;height:800px';
  f.srcdoc=h.replace('<head>','<head>'+catcher);document.body.appendChild(f);
  f.onload=function(){setTimeout(function(){
    var w=f.contentWindow,d=w.document;
    say('--- after the page loaded ---');
    say('Cities built: '+d.getElementById('cities').children.length+' (expect 8)');
    say('BizTrack buttons built: '+d.getElementById('dbtns').children.length+' (expect 3)');
    say('Popup ready (variable d): '+(w.d&&w.d.tagName?'yes':'NO - the page script stopped early'));
    try{d.querySelector('#auth [data-a="signup"]').click()}catch(e){say('Could not tap Sign up: '+e.message)}
    setTimeout(function(){
      var dl=d.getElementById('dlg');
      say('Sign up popup open after a tap: '+(dl&&dl.open?'YES':'NO'));
      say(errs.length?'Errors found: '+errs.length:'Errors found: none');
      say('--- done ---');
    },700);
  },3000)};
}).catch(function(e){say('Could not load index.html: '+e.message)});
</script></body></html>
