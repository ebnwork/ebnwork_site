<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b2252"><meta name="color-scheme" content="light"><title>Freelancer profile | EBN Work</title><style>
:root{color-scheme:light;--g:#0f2e6b;--gold:#f5b335;--ink:#0c1730;--mute:#4b5a78;--line:#dbe3f3;--soft:#eef3ff;--ok:#13753f}*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:#fff;font:16px/1.55 "Helvetica Neue",Arial,sans-serif}a{color:var(--g)}
header{border-bottom:3px solid var(--gold);background:#fff;position:sticky;top:0;z-index:5}.nav{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;max-width:820px;margin:0 auto}.nav a{text-decoration:none;font-weight:700}
main{max-width:820px;margin:0 auto;padding:0 0 60px}.pad{padding:0 18px}
.vid{background:#0b2252;position:relative}.vid video{display:block;width:100%;max-height:420px;background:#000}.noVid{padding:46px 18px;text-align:center;color:#d6e2ff;background:linear-gradient(160deg,#0b2252,#1a46a3)}.noVid i{font-style:normal;font-size:44px;display:block}
.head{display:flex;gap:14px;align-items:center;margin-top:16px}.av{width:84px;height:84px;border-radius:50%;object-fit:cover;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;color:var(--g);flex:none;border:3px solid #fff;box-shadow:0 2px 10px rgba(15,46,107,.2)}
h1{margin:0;font-size:clamp(24px,5.5vw,32px);line-height:1.1;letter-spacing:-.5px}.ttl{color:var(--mute);margin:2px 0}.pill{display:inline-block;border-radius:999px;padding:4px 14px;font-weight:800;font-size:13px;letter-spacing:.4px;margin-top:6px}.pill.ok{background:#e4f7ec;color:var(--ok)}.pill.no{background:#e8ebf1;color:#4b5a78}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.tags span{background:var(--soft);color:var(--g);border-radius:999px;padding:5px 14px;font-weight:600;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.stat{border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-size:22px;color:var(--g)}.stat span{font-size:13px;color:var(--mute)}
h2{font-size:20px;margin:24px 0 8px;color:var(--g)}.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.gal img{width:100%;height:130px;object-fit:cover;border-radius:12px;cursor:pointer;background:var(--soft)}
.btn{display:inline-block;border:1.5px solid var(--g);color:var(--g);background:#fff;border-radius:999px;padding:11px 20px;font:700 15px inherit;text-decoration:none;cursor:pointer;margin:8px 8px 0 0}.btn.f{background:var(--g);color:#fff}.btn.gold{background:var(--gold);border-color:var(--gold);color:#2b1d00}
.cta{background:var(--soft);border-radius:16px;padding:16px;margin:16px 0}.m{color:var(--mute);font-size:14px}
dialog{border:1px solid var(--line);border-radius:18px;padding:20px;max-width:520px;width:calc(100% - 24px);max-height:92vh;overflow:auto}dialog::backdrop{background:rgba(0,0,0,.6)}dialog img.big{width:100%;border-radius:12px}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 4px}input,textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;font:16px inherit}textarea{min-height:90px}
.pv{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.pv div{position:relative}.pv img{width:74px;height:74px;object-fit:cover;border-radius:10px}.pv button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:#b3261e;color:#fff;cursor:pointer}.err{color:#b3261e;font-weight:700;min-height:20px}
</style></head><body>
<header><div class="nav"><a href="./"><b>EBN Work</b></a><a href="freelancers.html">Find freelancers</a></div></header>
<main id="m"><p class="pad m" style="margin-top:24px">Loading profile...</p></main><dialog id="dlg"></dialog>
<script>
var API="https://ebn-work-api.onrender.com",tok=null,me=null,P=null,$=function(i){return document.getElementById(i)};
try{tok=localStorage.getItem("ebn_t")}catch(e){}
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var ID=Number((location.search.match(/[?&]id=(\d+)/)||[])[1]||0);
async function api(p,o){o=o||{};var h={"Content-Type":"application/json"};if(tok)h.Authorization="Bearer "+tok;var r=await fetch(API+"/api"+p,{method:o.m||"GET",headers:h,body:o.b?JSON.stringify(o.b):undefined}),j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.error||"Something went wrong.");return j}
async function raw(p,body){var r=await fetch(API+"/api"+p,{method:"POST",headers:{"Content-Type":"image/jpeg",Authorization:"Bearer "+tok},body:body}),j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.error||"Upload failed.");return j}
function shrink(file,max,limit){return new Promise(function(res,rej){var im=new Image(),u=URL.createObjectURL(file);im.onload=function(){var s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);var q=.8;(function t(){c.toBlob(function(b){if(!b)return rej(new Error("Could not read that photo."));if(b.size>limit&&q>.4){q-=.1;return t()}res(b)},"image/jpeg",q)})()};im.onerror=function(){rej(new Error("Could not read that photo."))};im.src=u})}
async function load(){if(!ID){$("m").innerHTML='<p class="pad">Profile not found.</p>';return}
 if(tok){try{me=await api("/me")}catch(e){me=null}}
 try{P=await api("/freelancers/"+ID)}catch(e){$("m").innerHTML='<p class="pad" style="margin-top:24px">'+esc(e.message)+' (the first load can take a minute, please refresh)</p>';return}
 document.title=P.name+" | EBN Work";render()}
function render(){var own=me&&me.id==P.id,skills=(P.skills||"").split(",").map(function(s){return s.trim()}).filter(Boolean),h='';
 h+='<div class="vid">'+(P.video?'<video controls playsinline preload="metadata" src="'+API+'/api/videos/'+P.id+'"></video>':'<div class="noVid"><i>&#127909;</i>'+(P.verified?"No video intro yet":"Video intro appears here once this freelancer is ID verified")+'</div>')+'</div><div class="pad">';
 h+='<div class="head">'+(P.avatar?'<img class="av" alt="" src="'+API+'/api/media/'+P.avatar+'">':'<div class="av">'+esc((P.name||"?").charAt(0).toUpperCase())+'</div>')+'<div><h1>'+esc(P.name)+'</h1>'+(P.title?'<div class="ttl">'+esc(P.title)+'</div>':'')+(P.county?'<div class="m">&#128205; '+esc(P.county)+'</div>':'')+(P.verified?'<span class="pill ok">&#10003; ID VERIFIED</span>':'<span class="pill no">Not Verified Yet</span>')+'</div></div>';
 if(!P.verified&&own)h+='<div class="cta"><b>Clients trust verified freelancers more.</b><div class="m">Verified freelancers get a green badge, show a video intro and appear first in search and proposals.</div><a class="btn gold" href="verify.html">Verify Now To Get More Jobs</a></div>';
 if(!P.verified&&!own)h+='<p class="m">This freelancer has not verified their ID yet. Consider asking them to verify before you pay.</p>';
 if(skills.length)h+='<div class="tags">'+skills.map(function(s){return'<span>'+esc(s)+'</span>'}).join("")+'</div>';
 h+='<div class="stats"><div class="stat"><b>'+(P.rating?"&#9733; "+P.rating:"New")+'</b><span>'+(P.reviews?P.reviews+" review"+(P.reviews>1?"s":""):"No reviews yet")+'</span></div><div class="stat"><b>'+P.jobs_done+'</b><span>Jobs done</span></div><div class="stat"><b>'+new Date(P.created_at).toLocaleDateString("en-KE",{month:"short",year:"numeric"})+'</b><span>Member since</span></div></div>';
 if(P.bio)h+='<h2>About</h2><p style="white-space:pre-wrap">'+esc(P.bio)+'</p>';
 if(P.portfolio.length)h+='<h2>Portfolio</h2><div class="gal">'+P.portfolio.map(function(i){return'<img alt="Portfolio photo" loading="lazy" data-i="'+i+'" src="'+API+'/api/media/'+i+'">'}).join("")+'</div>';
 if(own)h+='<p><button class="btn f" id="ed">Edit profile</button></p>';else h+='<div class="cta"><b>Want to hire '+esc(P.name.split(" ")[0])+'?</b><div class="m">Post a job. Freelancers send proposals, and you pick.</div><a class="btn f" href="./?post=1">Post a job</a></div>';
 h+='</div>';$("m").innerHTML=h;
 [].forEach.call(document.querySelectorAll(".gal img"),function(im){im.onclick=function(){var d=$("dlg");d.innerHTML='<img class="big" alt="" src="'+im.src+'"><p><button class="btn" id="cl">Close</button></p>';d.showModal();$("cl").onclick=function(){d.close()}}});
 if(own)$("ed").onclick=edit}
function edit(){var d=$("dlg");
 d.innerHTML='<h2 style="margin-top:0">Edit profile</h2><label>Profile photo</label><label class="btn" for="f_av" style="display:inline-block">Choose photo</label><input id="f_av" type="file" accept="image/*" hidden> <span class="m" id="avs"></span>'
 +'<label>Your title <span class="m">(e.g. Event Website Designer)</span></label><input id="f_t" maxlength="80" value="'+esc(P.title||"")+'">'
 +'<label>Location <span class="m">(e.g. Eldoret, Kenya)</span></label><input id="f_c" maxlength="60" value="'+esc(P.county||"")+'">'
 +'<label>Skills <span class="m">(separate with commas)</span></label><input id="f_s" maxlength="300" value="'+esc(P.skills||"")+'">'
 +'<label>About you</label><textarea id="f_b" maxlength="1000">'+esc(P.bio||"")+'</textarea>'
 +'<label>Portfolio photos <span class="m">(up to 6)</span></label><label class="btn" for="f_p" style="display:inline-block">Add photos</label><input id="f_p" type="file" accept="image/*" multiple hidden><div class="pv" id="pv">'+P.portfolio.map(function(i){return'<div><img alt="" src="'+API+'/api/media/'+i+'"><button data-r="'+i+'" aria-label="Remove">&times;</button></div>'}).join("")+'</div>'
 +'<div class="err" id="er" role="alert"></div><p><button class="btn f" id="sv">Save</button><button class="btn" id="cl">Close</button></p>';
 d.showModal();$("cl").onclick=function(){d.close();load()};
 $("f_av").onchange=async function(e){var f=e.target.files[0];if(!f)return;$("avs").textContent="Uploading...";try{await raw("/me/avatar",await shrink(f,600,250000));$("avs").textContent="Photo saved"}catch(x){$("er").textContent=x.message}};
 $("f_p").onchange=async function(e){var fs=[].slice.call(e.target.files);for(var i=0;i<fs.length;i++){try{var r=await raw("/me/portfolio",await shrink(fs[i],1200,380000));P.portfolio.push(r.id)}catch(x){$("er").textContent=x.message;break}}edit()};
 $("pv").onclick=async function(e){var b=e.target.closest("button");if(!b)return;try{await api("/me/media/"+b.dataset.r+"/remove",{m:"POST",b:{}});P.portfolio=P.portfolio.filter(function(i){return i!=b.dataset.r});edit()}catch(x){$("er").textContent=x.message}};
 $("sv").onclick=async function(){try{await api("/me/profile",{m:"POST",b:{title:$("f_t").value,county:$("f_c").value,skills:$("f_s").value,bio:$("f_b").value}});d.close();load()}catch(x){$("er").textContent=x.message}}}
load();
</script></body></html>
