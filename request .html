<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b2252"><meta name="color-scheme" content="light"><title>Request a quote | EBN Work</title><style>
:root{color-scheme:light;--g:#0f2e6b;--gold:#f5b335;--ink:#0c1730;--mute:#4b5a78;--line:#cdd8ef;--soft:#eef3ff}*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:var(--soft);font:16px/1.6 "Helvetica Neue",Arial,sans-serif}
header{border-bottom:3px solid var(--gold);background:#fff}.nav{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;max-width:640px;margin:0 auto}.nav b{font-size:19px}.nav a{text-decoration:none;font-weight:700;color:var(--g)}
main{max-width:640px;margin:0 auto;padding:26px 20px 60px}h1{font-size:clamp(28px,6vw,38px);line-height:1.1;margin:0 0 8px;color:var(--g);letter-spacing:-1px}.lead{color:var(--mute);margin:0 0 22px}
form,.done{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px}label{display:block;font-weight:700;font-size:15px;margin:16px 0 5px}label small{font-weight:400;color:var(--mute)}
input,select,textarea{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;font:16px "Helvetica Neue",Arial,sans-serif;color:var(--ink);background:#fff}textarea{min-height:130px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid rgba(245,179,53,.55);border-color:var(--g)}
.pkg{background:var(--soft);border-left:4px solid var(--gold);border-radius:10px;padding:10px 14px;margin:0 0 4px;font-size:15px}
button{width:100%;margin-top:22px;padding:15px;border:0;border-radius:999px;background:var(--g);color:#fff;font:700 17px "Helvetica Neue",Arial,sans-serif;cursor:pointer}button:disabled{opacity:.6}
#msg{margin-top:14px;font-weight:700;min-height:22px}#msg.err{color:#b3261e}#msg.wait{color:var(--mute);font-weight:400}.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.done{text-align:center}.done h2{color:var(--g);margin:0 0 8px}.btn{display:inline-block;margin-top:14px;padding:12px 24px;border-radius:999px;background:var(--g);color:#fff;font-weight:700;text-decoration:none}.note{color:var(--mute);font-size:14px;margin-top:16px}
</style></head><body>
<header><div class="nav"><b>EBN Work</b><a href="pricing.html">&larr; Back to pricing</a></div></header>
<main><h1>Request a quote</h1><p class="lead">No account needed. Tell us what you need and we will contact you.</p>
<form id="f" novalidate>
<div class="pkg" id="pk" hidden></div>
<label for="sv">Service</label><select id="sv"><option>Websites</option><option>Logo and branding</option><option>Bookkeeping set-up</option><option>Social media management</option><option>Something else</option></select>
<label for="nm">Your name</label><input id="nm" autocomplete="name" maxlength="80">
<label for="ph">Phone number</label><input id="ph" type="tel" inputmode="tel" autocomplete="tel" placeholder="e.g. 0712 345 678" maxlength="20">
<label for="em">Email <small>(optional)</small></label><input id="em" type="email" autocomplete="email" maxlength="120">
<label for="dt">What do you need?</label><textarea id="dt" maxlength="1500" placeholder="Tell us about your business and what you want done."></textarea>
<div class="hp" aria-hidden="true"><label>Website<input id="hp" tabindex="-1" autocomplete="off"></label></div>
<button id="go" type="submit">Send request</button><div id="msg" role="status"></div>
</form>
<div class="done" id="ok" hidden><h2>Thank you!</h2><p>We have received your request and will contact you soon.</p><a class="btn" href="./">Back to home</a></div>
<p class="note">Prices on our pricing page are starting prices. We confirm your exact quote after reading your request.</p></main>
<script>
var API="https://ebn-work-api.onrender.com";
var $=function(i){return document.getElementById(i)},P=new URLSearchParams(location.search),pkg=(P.get("package")||"").slice(0,60),sv=P.get("service")||"";
[].forEach.call($("sv").options,function(o){if(o.value===sv)$("sv").value=sv});
if(pkg){$("pk").hidden=false;$("pk").textContent="Selected package: "+pkg+" (starting price)"}
function say(t,c){$("msg").textContent=t;$("msg").className=c||""}
$("f").addEventListener("submit",function(e){e.preventDefault();
 var n=$("nm").value.trim(),p=$("ph").value.trim(),m=$("em").value.trim(),d=$("dt").value.trim();
 if(n.length<2)return say("Please enter your name.","err");
 if(!/^[0-9+() -]{7,20}$/.test(p))return say("Please enter a valid phone number.","err");
 if(m&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m))return say("Please check your email address.","err");
 if(d.length<10)return say("Please tell us a little more about what you need.","err");
 $("go").disabled=true;say("Sending... the first request can take up to a minute. Please wait.","wait");
 fetch(API+"/api/quotes",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({service:$("sv").value,package:pkg,name:n,phone:p,email:m,details:d,website:$("hp").value})})
 .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||"Something went wrong.");return j})})
 .then(function(){$("f").hidden=true;$("ok").hidden=false;window.scrollTo(0,0)})
 .catch(function(x){$("go").disabled=false;say((x&&x.message&&x.message!=="Failed to fetch")?x.message:"We could not send your request. Please check your internet and try again.","err")});
});
</script></body></html>
